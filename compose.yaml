# Generated by TdA template generator — run: docker compose up --build
# network_mode: host mirrors Tour de Cloud, where all containers share one pod's
# localhost. Host ports 80 (caddy) and 3306 (mysql) must be free.
name: tda-app

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    env_file: ./frontend/.env
    network_mode: host

  server:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    env_file: ./backend/.env
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    network_mode: host
    environment:
      MYSQL_DATABASE: product
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    network_mode: host
    depends_on:
      - web
      - server
