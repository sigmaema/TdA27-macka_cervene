openapi: 3.1.0

info:
  title: Think different Transit API
  version: 1.2.0
  description: API for managing public transport stops in Think different Academy.

servers:
  - url: /api/v1

tags:
  - name: Stops
    description: Stop management

paths:
  /stops:
    get:
      tags:
        - Stops
      summary: List all stops
      operationId: getStops
      responses:
        "200":
          description: List of stops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stop"

    post:
      tags:
        - Stops
      summary: Create a new stop
      operationId: createStop
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopInput"
      responses:
        "201":
          description: Stop created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stop"

        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "401":
          description: Missing or invalid administrator API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stops/{id}:
    parameters:
      - $ref: "#/components/parameters/StopId"

    get:
      tags:
        - Stops
      summary: Get stop detail
      operationId: getStop
      responses:
        "200":
          description: Stop detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stop"

        "400":
          description: Invalid stop ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "404":
          description: Stop not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags:
        - Stops
      summary: Update a stop
      description: Replaces the editable data of an existing stop. The complete StopInput object must be provided.
      operationId: updateStop
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopInput"
      responses:
        "200":
          description: Stop updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stop"

        "400":
          description: Invalid stop ID or input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "401":
          description: Missing or invalid administrator API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "404":
          description: Stop not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - Stops
      summary: Delete a stop
      operationId: deleteStop
      security:
        - AdminApiKey: []
      responses:
        "204":
          description: Stop deleted successfully

        "400":
          description: Invalid stop ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "401":
          description: Missing or invalid administrator API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "404":
          description: Stop not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "409":
          description: Stop cannot be deleted because it is used by an existing route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    AdminApiKey:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: >
        Administrator API key required for operations that modify data.
        Send it in the Authorization header as:
        Bearer Kyqc49jIM+5+D0Sed8ZQ671gxkd7W/bBTWjDtZ0Zrgk=

  parameters:
    StopId:
      name: id
      in: path
      required: true
      description: Stop ID
      schema:
        type: integer
        minimum: 1
      example: 12

  schemas:
    Stop:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - image_url
        - wheelchair_accessible
        - has_shelter
        - has_ticket_machine
      properties:
        id:
          type: integer
          readOnly: true
          example: 12

        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Cejl

        image_url:
          type:
            - string
            - "null"
          format: uri
          maxLength: 255
          example: https://example.com/stops/cejl.jpg

        wheelchair_accessible:
          type: boolean
          example: true

        has_shelter:
          type: boolean
          example: true

        has_ticket_machine:
          type: boolean
          example: false

    StopInput:
      type: object
      additionalProperties: false
      required:
        - name
        - wheelchair_accessible
        - has_shelter
        - has_ticket_machine
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Cejl

        image_url:
          type:
            - string
            - "null"
          format: uri
          maxLength: 255
          example: https://example.com/stops/cejl.jpg

        wheelchair_accessible:
          type: boolean
          example: true

        has_shelter:
          type: boolean
          example: true

        has_ticket_machine:
          type: boolean
          example: false

    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          example: Stop not found